<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Hamzz Cloud</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 30%, #667eea15, #0f0f1a);
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
        }

        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #a0a0b0;
            transition: color 0.2s;
            font-weight: 500;
        }

        .nav-links a:hover, .nav-links a.active { color: #667eea; }

        .btn-glass {
            background: rgba(102, 126, 234, 0.15);
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 0.5rem 1.25rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        .upload-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            padding: 2rem;
            margin-bottom: 2rem;
            animation: fadeInUp 0.6s ease;
        }

        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.4);
            border-radius: 24px;
            padding: 4rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0, 0, 0, 0.2);
        }

        .upload-area.drag-over {
            border-color: #667eea;
            background: rgba(102, 126, 234, 0.1);
            transform: scale(1.01);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea20, #764ba220);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2.5rem;
        }

        .expiry-section { margin: 1.5rem 0; }
        .expiry-label { color: #c0c0d0; font-size: 0.875rem; margin-bottom: 0.75rem; display: block; }
        .expiry-options { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .expiry-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.25rem;
            border-radius: 40px;
            color: #c0c0d0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .expiry-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-color: transparent;
            color: white;
        }

        .progress-container { margin-top: 1rem; display: none; }
        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }

        .file-list-container {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .file-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .file-header h3 { color: white; }

        .file-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
        }
        .file-header-row { color: #a0a0b0; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .file-name { color: white; font-weight: 500; }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e1e2a;
            border: 1px solid rgba(102, 126, 234, 0.3);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            color: white;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/'">
            <div class="logo-icon">☁️</div>
            <h1>Hamzz Cloud</h1>
        </div>
        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/upload" class="active">Upload</a>
            <a href="/docs">Docs</a>
            <a href="/pricing">Pricing</a>
            <a href="/login" class="btn-glass" id="authBtn">Sign In</a>
            <a href="/dashboard" class="btn-primary" id="dashboardBtn" style="display:none;">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <h3 style="color: white;">Drop files here or click to browse</h3>
                <p style="color: #a0a0b0; margin-top: 0.5rem;">Maximum file size: 50MB</p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>

            <div class="expiry-section">
                <span class="expiry-label">⏱️ Link Expiry Time</span>
                <div class="expiry-options" id="expiryOptions">
                    <button class="expiry-btn" data-expiry="5m">5 Minutes</button>
                    <button class="expiry-btn" data-expiry="1d">1 Day</button>
                    <button class="expiry-btn" data-expiry="7d">7 Days</button>
                    <button class="expiry-btn" data-expiry="30d">30 Days</button>
                    <button class="expiry-btn active" data-expiry="never">Never Expire</button>
                </div>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar-wrapper"><div class="progress-fill" id="progressFill"></div></div>
                <p style="color: #a0a0b0; font-size: 0.75rem; margin-top: 0.5rem; text-align: center;" id="progressText">0%</p>
            </div>
        </div>

        <div class="file-list-container">
            <div class="file-header"><h3>My Files</h3><button class="btn-glass" onclick="loadFiles()">⟳ Refresh</button></div>
            <div class="file-row file-header-row"><div>File Name</div><div>Size</div><div>Status</div><div>Action</div></div>
            <div id="fileList"><div class="file-row" style="justify-content:center; display:flex;">Loading...</div></div>
        </div>
    </div>

    <script>
        let selectedFiles = [];
        let currentExpiry = 'never';

        // Check login status
        const token = localStorage.getItem('token');
        const authBtn = document.getElementById('authBtn');
        const dashboardBtn = document.getElementById('dashboardBtn');
        
        if (token) {
            authBtn.style.display = 'none';
            dashboardBtn.style.display = 'inline-block';
        }

        // Expiry buttons
        document.querySelectorAll('.expiry-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.expiry-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentExpiry = btn.dataset.expiry;
            });
        });

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('drag-over'); });
        uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); handleFiles(Array.from(e.dataTransfer.files)); });
        uploadArea.addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', (e) => { handleFiles(Array.from(e.target.files)); });

        function handleFiles(files) {
            if (!token) {
                showToast('Please login first', 'error');
                setTimeout(() => window.location.href = '/login', 1500);
                return;
            }
            selectedFiles = files.filter(f => f.size <= 50 * 1024 * 1024);
            if (selectedFiles.length === 0) { showToast('Files exceed 50MB limit', 'error'); return; }
            uploadFiles();
        }

        async function getApiKey() {
            try {
                const res = await fetch('/api/keys', { headers: { 'Authorization': `Bearer ${token}` } });
                const keys = await res.json();
                return keys[0]?.apiKey || null;
            } catch(e) { return null; }
        }

        async function uploadFiles() {
            const apiKey = await getApiKey();
            if (!apiKey) { showToast('Failed to get API key', 'error'); return; }

            progressContainer.style.display = 'block';
            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('expiry', currentExpiry);

                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = `${percent}%`;
                            progressText.textContent = `${percent}% - ${file.name}`;
                        }
                    });
                    xhr.onload = () => {
                        if (xhr.status === 200) { showToast(`✓ ${file.name} uploaded`, 'success'); resolve(); }
                        else reject();
                    };
                    xhr.onerror = () => reject();
                    xhr.open('POST', '/api/upload');
                    xhr.setRequestHeader('x-api-key', apiKey);
                    xhr.send(formData);
                });
            }
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            loadFiles();
            showToast('All files uploaded!', 'success');
        }

        async function loadFiles() {
            if (!token) { document.getElementById('fileList').innerHTML = '<div class="file-row">Login to see your files</div>'; return; }
            try {
                const res = await fetch('/api/files', { headers: { 'Authorization': `Bearer ${token}` } });
                if (res.status === 401) { document.getElementById('fileList').innerHTML = '<div class="file-row">Please login again</div>'; return; }
                const files = await res.json();
                if (files.length === 0) { document.getElementById('fileList').innerHTML = '<div class="file-row">No files yet</div>'; return; }
                document.getElementById('fileList').innerHTML = files.map(file => `
                    <div class="file-row">
                        <div class="file-name">${escapeHtml(file.originalName)}</div>
                        <div>${(file.size/1024/1024).toFixed(2)} MB</div>
                        <div>${file.expiredAt && new Date(file.expiredAt) < new Date() ? '<span style="color:#ef4444;">Expired</span>' : '<span style="color:#10b981;">Active</span>'}</div>
                        <div><a href="/api/file/${file._id}" target="_blank" style="color:#667eea;">Download</a></div>
                    </div>
                `).join('');
            } catch(err) { document.getElementById('fileList').innerHTML = '<div class="file-row">Error loading files</div>'; }
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, function(m){ return m==='&'?'&amp;':m==='<'?'&lt;':'&gt;';}); }
        function showToast(msg, type) { const t=document.createElement('div');t.className='toast';t.innerHTML=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),3000); }
        
        loadFiles();
    </script>
</body>
</html>
