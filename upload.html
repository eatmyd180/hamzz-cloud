<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - Hamzz Cloud</title>
    <link rel="icon" type="image/png" href="https://hamzz-cloud.vercel.app/api/file/6a13bbe0cb6883423a83d3be">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0a0a0f;
            min-height: 100vh;
        }

        /* Animated Background */
        .bg-grid {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -2;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 100%);
        }
        .bg-grid::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(102,126,234,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(102,126,234,0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: gridMove 20s linear infinite;
        }
        @keyframes gridMove {
            0% { transform: translate(0,0); }
            100% { transform: translate(50px,50px); }
        }
        .bg-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 30% 40%, rgba(102,126,234,0.15), transparent 50%),
                        radial-gradient(ellipse at 70% 60%, rgba(118,75,162,0.15), transparent 50%);
            animation: glowPulse 8s ease-in-out infinite;
        }
        @keyframes glowPulse { 0%,100% { opacity:0.5; } 50% { opacity:1; } }

        /* Navbar with Hamburger */
        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,15,0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102,126,234,0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
        .logo-icon { width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; }
        .logo-icon img { width:36px; height:36px; border-radius:10px; }
        .logo h1 { font-size:1.5rem; background:linear-gradient(135deg,#667eea,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:700; }
        
        /* Hamburger Menu */
        .hamburger {
            display: none;
            flex-direction: column;
            cursor: pointer;
            gap: 5px;
            z-index: 101;
        }
        .hamburger span {
            width: 25px;
            height: 2px;
            background: white;
            transition: all 0.3s;
        }
        .hamburger.active span:nth-child(1) { transform: rotate(45deg) translate(5px, 5px); }
        .hamburger.active span:nth-child(2) { opacity: 0; }
        .hamburger.active span:nth-child(3) { transform: rotate(-45deg) translate(5px, -5px); }
        
        .nav-links {
            display: flex;
            gap: 1.5rem;
            align-items: center;
            flex-wrap: wrap;
            transition: all 0.3s;
        }
        .nav-links a { text-decoration: none; color: #a0a0b0; transition: color 0.2s; font-weight: 500; }
        .nav-links a:hover, .nav-links a.active { color: #667eea; }
        
        @media (max-width: 768px) {
            .hamburger { display: flex; }
            .nav-links {
                position: fixed;
                top: 70px;
                left: -100%;
                width: 100%;
                background: rgba(10,10,15,0.95);
                backdrop-filter: blur(20px);
                flex-direction: column;
                padding: 2rem;
                transition: left 0.3s;
                z-index: 99;
            }
            .nav-links.active { left: 0; }
        }
        
        .btn-glass { background:rgba(102,126,234,0.15); border:1px solid rgba(102,126,234,0.3); padding:0.5rem 1.25rem; border-radius:40px; color:white; cursor:pointer; transition:all 0.2s; text-decoration:none; }
        .btn-primary { background:linear-gradient(135deg,#667eea,#764ba2); border:none; padding:0.5rem 1.25rem; border-radius:40px; color:white; font-weight:600; cursor:pointer; transition:all 0.3s; text-decoration:none; display:inline-block; }

        .container { max-width: 1000px; margin: 0 auto; padding: 2rem; }

        /* Upload Card with Animation */
        .upload-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 2rem;
            margin-bottom: 2rem;
            transition: all 0.3s;
            animation: fadeInUp 0.6s ease;
        }
        .upload-card:hover { transform: translateY(-5px); border-color: rgba(102,126,234,0.3); }
        
        .upload-area {
            border: 2px dashed rgba(102,126,234,0.4);
            border-radius: 24px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: rgba(0,0,0,0.2);
        }
        .upload-area.drag-over { border-color: #667eea; background: rgba(102,126,234,0.1); transform: scale(1.02); }
        .upload-area:hover { transform: scale(1.01); }
        
        .expiry-section { margin: 1.5rem 0; }
        .expiry-label { color: #c0c0d0; font-size: 0.875rem; margin-bottom: 0.75rem; display: block; }
        .expiry-options { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .expiry-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 0.5rem 1.25rem;
            border-radius: 40px;
            color: #c0c0d0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .expiry-btn:hover { transform: translateY(-2px); background: rgba(102,126,234,0.2); }
        .expiry-btn.active { background: linear-gradient(135deg,#667eea,#764ba2); border-color: transparent; color: white; }
        
        .upload-submit-btn {
            width: 100%;
            background: linear-gradient(135deg,#667eea,#764ba2);
            border: none;
            padding: 1rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-submit-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 30px rgba(102,126,234,0.4); }
        .upload-submit-btn:active { transform: translateY(0); }
        
        /* Animated Cloud */
        .cloud-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
        }
        .cloud-icon {
            font-size: 2rem;
            animation: cloudFloat 1s ease-in-out infinite;
        }
        @keyframes cloudFloat {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        .progress-container { margin-top: 1rem; display: none; }
        .progress-bar-wrapper {
            background: rgba(255,255,255,0.1);
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg,#667eea,#764ba2);
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }
        
        .url-result {
            background: rgba(16,185,129,0.1);
            border: 1px solid rgba(16,185,129,0.3);
            border-radius: 16px;
            padding: 1rem;
            margin: 1rem 0;
            display: none;
        }
        .url-result.show { display: block; animation: fadeInUp 0.3s ease; }
        
        .files-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 24px;
            overflow: hidden;
        }
        .files-header { padding: 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap:1rem; }
        .file-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.5fr;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            align-items: center;
            transition: background 0.2s;
        }
        .file-row:hover { background: rgba(255,255,255,0.05); }
        
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e1e2a;
            border: 1px solid rgba(102,126,234,0.3);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            color: white;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
        }
        
        @keyframes fadeInUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
        @keyframes slideInRight { from { transform:translateX(100%); opacity:0; } to { transform:translateX(0); opacity:1; } }
        
        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .container { padding: 1rem; }
            .file-row { grid-template-columns: 1fr; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/'">
            <div class="logo-icon"><img src="https://hamzz-cloud.vercel.app/api/file/6a13bbe0cb6883423a83d3be" alt="Hamzz Cloud Logo"></div>
            <h1>Hamzz Cloud</h1>
        </div>
        <div class="hamburger" id="hamburger">
            <span></span><span></span><span></span>
        </div>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/upload" class="active">Upload</a>
            <a href="/docs">Docs</a>
            <a href="/pricing">Pricing</a>
            <a href="/login" class="btn-glass" id="authBtn">Sign In</a>
            <a href="/dashboard" class="btn-primary" id="dashboardBtn" style="display:none;">Dashboard</a>
        </div>
    </nav>

    <div class="container">
        <div class="upload-card">
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 3rem; margin-bottom: 0.5rem;">☁️</div>
                <p style="color: white;">Drag & drop or click to browse</p>
                <p style="color: #a0a0b0; font-size: 0.75rem;">Max 50MB per file</p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>
            <div class="expiry-section">
                <span class="expiry-label">⏱️ Link Expiry</span>
                <div class="expiry-options" id="expiryOptions">
                    <button class="expiry-btn" data-expiry="5m">5 Menit</button>
                    <button class="expiry-btn" data-expiry="1d">1 Hari</button>
                    <button class="expiry-btn" data-expiry="7d">7 Hari</button>
                    <button class="expiry-btn" data-expiry="30d">30 Hari</button>
                    <button class="expiry-btn active" data-expiry="never">Never</button>
                </div>
            </div>
            <button class="upload-submit-btn" id="uploadBtn">☁️ Upload to Cloud</button>
            
            <div class="progress-container" id="progressContainer">
                <div class="cloud-loading"><div class="cloud-icon">☁️</div><div class="loading-text">Uploading to cloud...</div></div>
                <div class="progress-bar-wrapper"><div class="progress-fill" id="progressFill"></div></div>
                <p style="color:#a0a0b0; font-size:0.75rem; text-align:center; margin-top:0.5rem;" id="progressText">0%</p>
            </div>
            <div class="url-result" id="urlResult">
                <div class="url-label">✅ File uploaded successfully!</div>
                <code class="url-link" id="uploadedUrl" style="display:block; word-break:break-all;"></code>
                <button class="copy-btn" onclick="copyUrl()" style="margin-top:0.5rem; padding:0.25rem 0.75rem;">Copy URL</button>
            </div>
        </div>

        <div class="files-card">
            <div class="files-header"><h3 style="color:white;">📁 My Files</h3><button class="btn-glass" onclick="loadFiles()">⟳ Refresh</button></div>
            <div id="filesList"><div class="file-row">Loading...</div></div>
        </div>
    </div>

    <script>
        // Hamburger menu
        const hamburger = document.getElementById('hamburger');
        const navLinks = document.getElementById('navLinks');
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navLinks.classList.toggle('active');
        });
        
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';
        else {
            document.getElementById('authBtn').style.display = 'none';
            document.getElementById('dashboardBtn').style.display = 'inline-block';
        }

        let selectedFiles = [];
        let currentExpiry = 'never';
        let lastUploadedUrl = '';

        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function copyUrl() {
            if (lastUploadedUrl) {
                navigator.clipboard.writeText(lastUploadedUrl);
                showToast('URL copied to clipboard!');
            }
        }

        async function apiCall(endpoint, options = {}) {
            const res = await fetch(endpoint, {
                ...options,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...options.headers }
            });
            if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
            return res.json();
        }

        async function loadFiles() {
            try {
                const files = await apiCall('/api/files');
                const container = document.getElementById('filesList');
                if (!files.length) { container.innerHTML = '<div class="file-row">No files yet</div>'; return; }
                container.innerHTML = files.map(file => `
                    <div class="file-row">
                        <div style="color:white;">${escapeHtml(file.originalName).substring(0, 40)}</div>
                        <div>${(file.size/1024/1024).toFixed(2)} MB</div>
                        <div>${file.expiredAt && new Date(file.expiredAt) < new Date() ? '<span style="color:#ef4444;">Expired</span>' : '<span style="color:#10b981;">Active</span>'}</div>
                        <div><a href="/api/file/${file._id}" target="_blank" style="color:#667eea;">🔗 Link</a></div>
                    </div>
                `).join('');
            } catch(e) { showToast('Failed to load files', 'error'); }
        }

        document.querySelectorAll('.expiry-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.expiry-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentExpiry = btn.dataset.expiry;
            });
        });

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const urlResult = document.getElementById('urlResult');
        const uploadedUrlSpan = document.getElementById('uploadedUrl');

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('drag-over'); });
        uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); handleFiles(Array.from(e.dataTransfer.files)); });
        uploadArea.addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', (e) => { handleFiles(Array.from(e.target.files)); });

        function handleFiles(files) {
            selectedFiles = files.filter(f => f.size <= 50 * 1024 * 1024);
            if (!selectedFiles.length) { showToast('Files exceed 50MB limit', 'error'); return; }
            uploadFiles();
        }

        async function getFirstApiKey() {
            const keys = await apiCall('/api/keys');
            return keys[0]?.apiKey;
        }

        async function uploadFiles() {
            const apiKey = await getFirstApiKey();
            if (!apiKey) { showToast('Create an API key first in Dashboard', 'error'); return; }

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            urlResult.classList.remove('show');

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('expiry', currentExpiry);

                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = `${percent}%`;
                            progressText.textContent = `${percent}% - ${file.name}`;
                        }
                    });
                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            const response = JSON.parse(xhr.responseText);
                            const fullUrl = response.fullUrl || `${window.location.origin}/api/file/${response.fileId}`;
                            lastUploadedUrl = fullUrl;
                            uploadedUrlSpan.textContent = fullUrl;
                            urlResult.classList.add('show');
                            showToast(`✓ ${file.name} uploaded!`);
                            resolve();
                        } else { reject(); }
                    };
                    xhr.onerror = () => reject();
                    xhr.open('POST', '/api/upload');
                    xhr.setRequestHeader('x-api-key', apiKey);
                    xhr.send(formData);
                });
            }

            uploadBtn.disabled = false;
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            selectedFiles = [];
            loadFiles();
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
        loadFiles();
    </script>
</body>
</html>
