<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hamzz Cloud</title>
    <link rel="icon" type="image/png" href="https://hamzz-cloud.vercel.app/api/file/6a13bbe0cb6883423a83d3be">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: #0f0f1a;
            min-height: 100vh;
        }

        .bg-gradient {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: -1;
            background: radial-gradient(ellipse at 20% 30%, #667eea15, #0f0f1a);
        }

        .navbar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(15, 15, 26, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(102, 126, 234, 0.2);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo { display: flex; align-items: center; gap: 0.75rem; cursor: pointer; }
        .logo-icon {
            width: 40px; height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-icon img { width: 32px; height: 32px; border-radius: 8px; }
        .logo h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .nav-links { display: flex; gap: 1.5rem; align-items: center; flex-wrap: wrap; }
        .nav-links a { text-decoration: none; color: #a0a0b0; transition: color 0.2s; font-weight: 500; }
        .nav-links a:hover { color: #667eea; }
        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(102, 126, 234, 0.15);
            padding: 0.5rem 1rem;
            border-radius: 40px;
        }
        .user-avatar {
            width: 32px; height: 32px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.875rem;
        }
        .logout-btn { background: none; border: none; color: #ef4444; cursor: pointer; font-size: 0.875rem; }
        .container { max-width: 1400px; margin: 0 auto; padding: 2rem; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 1.5rem;
            transition: all 0.3s;
        }
        .stat-card:hover { transform: translateY(-5px); border-color: rgba(102, 126, 234, 0.5); }
        .stat-card h3 { color: #a0a0b0; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .stat-value { font-size: 2.5rem; font-weight: 700; color: white; }

        .upload-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 2rem;
        }
        .upload-area {
            border: 2px dashed rgba(102, 126, 234, 0.4);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-area.drag-over { border-color: #667eea; background: rgba(102, 126, 234, 0.1); transform: scale(1.01); }
        .expiry-section { margin: 1.5rem 0; }
        .expiry-label { color: #c0c0d0; font-size: 0.875rem; margin-bottom: 0.75rem; display: block; }
        .expiry-options { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .expiry-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 0.5rem 1.25rem;
            border-radius: 40px;
            color: #c0c0d0;
            cursor: pointer;
            transition: all 0.2s;
        }
        .expiry-btn.active { background: linear-gradient(135deg, #667eea, #764ba2); border-color: transparent; color: white; }
        .upload-submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            padding: 0.875rem;
            border-radius: 40px;
            color: white;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .upload-submit-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3); }

        .cloud-loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
        }
        .cloud-icon {
            font-size: 2rem;
            animation: cloudFloat 1s ease-in-out infinite;
        }
        @keyframes cloudFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .progress-container { margin-top: 1rem; display: none; }
        .progress-bar-wrapper {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            height: 8px;
            overflow: hidden;
        }
        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            border-radius: 40px;
            transition: width 0.3s;
        }

        .url-result {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 16px;
            padding: 1rem;
            margin: 1rem 0;
            display: none;
        }
        .url-result.show { display: block; animation: fadeInUp 0.3s ease; }
        .url-label { color: #10b981; font-size: 0.75rem; margin-bottom: 0.25rem; }
        .url-link {
            color: white;
            text-decoration: none;
            font-family: monospace;
            font-size: 0.875rem;
            word-break: break-all;
            background: rgba(0,0,0,0.3);
            padding: 0.5rem;
            border-radius: 8px;
            display: block;
        }
        .copy-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            padding: 0.25rem 0.75rem;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            font-size: 0.75rem;
            margin-left: 0.5rem;
        }

        .api-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            margin-bottom: 2rem;
            overflow: hidden;
        }
        .api-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .api-header h3 { color: white; }
        .create-key-btn {
            background: linear-gradient(135deg, #10b981, #059669);
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: white;
            cursor: pointer;
        }
        .api-key-item {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .api-key-code {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 0.25rem 0.5rem;
            border-radius: 8px;
            font-size: 0.75rem;
        }
        .delete-key {
            background: rgba(239,68,68,0.2);
            border: 1px solid rgba(239,68,68,0.3);
            padding: 0.25rem 0.75rem;
            border-radius: 40px;
            color: #ef4444;
            cursor: pointer;
        }

        .files-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            overflow: hidden;
        }
        .files-header {
            padding: 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .files-header h3 { color: white; }
        .refresh-btn {
            background: rgba(59,130,246,0.2);
            border: 1px solid rgba(59,130,246,0.3);
            padding: 0.5rem 1rem;
            border-radius: 40px;
            color: #3b82f6;
            cursor: pointer;
        }
        .file-table {
            width: 100%;
            overflow-x: auto;
        }
        .file-row {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1.5fr;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            align-items: center;
            gap: 1rem;
        }
        .file-header-row {
            color: #a0a0b0;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .file-name { color: white; font-weight: 500; word-break: break-word; }

        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: #1e1e2a;
            border: 1px solid rgba(102,126,234,0.3);
            padding: 1rem 1.5rem;
            border-radius: 16px;
            color: white;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            max-width: 400px;
        }
        .toast.success { border-color: #10b981; background: rgba(16,185,129,0.1); }
        .toast.error { border-color: #ef4444; background: rgba(239,68,68,0.1); }
        .toast-url { font-family: monospace; font-size: 0.7rem; word-break: break-all; margin-top: 0.25rem; }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        @media (max-width: 768px) {
            .navbar { padding: 1rem; }
            .container { padding: 1rem; }
            .file-row { grid-template-columns: 1fr; gap: 0.5rem; }
            .file-header-row { display: none; }
        }
    </style>
</head>
<body>
    <div class="bg-gradient"></div>

    <nav class="navbar">
        <div class="logo" onclick="window.location.href='/'">
            <div class="logo-icon">
                <img src="https://hamzz-cloud.vercel.app/api/file/6a13bbe0cb6883423a83d3be" alt="Hamzz Cloud Logo">
            </div>
            <h1>Hamzz Cloud</h1>
        </div>
        <div class="nav-links">
            <a href="/upload">Upload</a>
            <a href="/docs">Docs</a>
            <a href="/pricing">Pricing</a>
            <div class="user-info">
                <div class="user-avatar">👤</div>
                <span id="userName" style="color:white;"></span>
                <button class="logout-btn" onclick="logout()">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><h3>Total Files</h3><div class="stat-value" id="totalFiles">0</div></div>
            <div class="stat-card"><h3>Storage Used</h3><div class="stat-value" id="totalSize">0 MB</div></div>
            <div class="stat-card"><h3>API Keys</h3><div class="stat-value" id="totalKeys">0</div></div>
        </div>

        <div class="upload-card">
            <div class="upload-area" id="uploadArea">
                <div style="font-size: 3rem; margin-bottom: 0.5rem;">☁️</div>
                <p style="color: white;">Drag & drop or click to browse</p>
                <p style="color: #a0a0b0; font-size: 0.75rem;">Max 50MB per file</p>
                <input type="file" id="fileInput" multiple style="display: none;">
            </div>
            <div class="expiry-section">
                <span class="expiry-label">⏱️ Link Expiry</span>
                <div class="expiry-options" id="expiryOptions">
                    <button class="expiry-btn" data-expiry="5m">5 Menit</button>
                    <button class="expiry-btn" data-expiry="1d">1 Hari</button>
                    <button class="expiry-btn" data-expiry="7d">7 Hari</button>
                    <button class="expiry-btn" data-expiry="30d">30 Hari</button>
                    <button class="expiry-btn active" data-expiry="never">Never</button>
                </div>
            </div>
            <button class="upload-submit-btn" id="uploadBtn">☁️ Upload to Cloud</button>
            
            <div class="progress-container" id="progressContainer">
                <div class="cloud-loading" id="cloudLoading">
                    <div class="cloud-icon">☁️</div>
                    <div class="loading-text">Uploading to cloud...</div>
                </div>
                <div class="progress-bar-wrapper"><div class="progress-fill" id="progressFill"></div></div>
                <p style="color: #a0a0b0; font-size: 0.75rem; text-align: center; margin-top: 0.5rem;" id="progressText">0%</p>
            </div>

            <div class="url-result" id="urlResult">
                <div class="url-label">✅ File uploaded successfully!</div>
                <div style="display: flex; align-items: center; flex-wrap: wrap; gap: 0.5rem;">
                    <code class="url-link" id="uploadedUrl"></code>
                    <button class="copy-btn" onclick="copyUrl()">Copy URL</button>
                </div>
            </div>
        </div>

        <div class="api-card">
            <div class="api-header"><h3>🔑 API Keys</h3><button class="create-key-btn" onclick="createApiKey()">+ New API Key</button></div>
            <div id="apiKeysList"><div class="api-key-item">Loading...</div></div>
        </div>

        <div class="files-card">
            <div class="files-header"><h3>📁 My Files</h3><button class="refresh-btn" onclick="loadFiles()">⟳ Refresh</button></div>
            <div class="file-table">
                <div class="file-row file-header-row">
                    <div>File Name</div>
                    <div>Size</div>
                    <div>Status</div>
                    <div>Link</div>
                </div>
                <div id="filesList"><div class="file-row">Loading...</div></div>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        let selectedFiles = [];
        let currentExpiry = 'never';
        let lastUploadedUrl = '';

        function showToast(message, type = 'success', url = '') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            if (url) {
                toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><div><div>${message}</div><div class="toast-url">🔗 ${url.substring(0, 60)}${url.length > 60 ? '...' : ''}</div></div>`;
            } else {
                toast.innerHTML = `<span>${type === 'success' ? '✅' : '❌'}</span><span>${message}</span>`;
            }
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        function copyUrl() {
            if (lastUploadedUrl) {
                navigator.clipboard.writeText(lastUploadedUrl);
                showToast('URL copied to clipboard!', 'success');
            }
        }

        async function apiCall(endpoint, options = {}) {
            const res = await fetch(endpoint, {
                ...options,
                headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json', ...options.headers }
            });
            if (res.status === 401) { localStorage.clear(); window.location.href = '/login'; }
            return res.json();
        }

        async function loadUser() {
            try {
                const data = await apiCall('/api/auth/me');
                if (data.user) {
                    document.getElementById('userName').innerText = data.user.username;
                    document.getElementById('totalKeys').innerText = data.apiKeys.length;
                    loadApiKeys();
                }
            } catch(e) { showToast('Failed to load user', 'error'); }
        }

        async function loadApiKeys() {
            const keys = await apiCall('/api/keys');
            const container = document.getElementById('apiKeysList');
            if (!keys.length) { container.innerHTML = '<div class="api-key-item">No API keys yet</div>'; return; }
            container.innerHTML = keys.map(key => `
                <div class="api-key-item">
                    <div><strong>${key.name}</strong><br><span class="api-key-code">${key.apiKey}</span><br><small>${key.plan} | ${key.requestsUsed}/${key.rateLimit} requests</small></div>
                    <button class="delete-key" onclick="deleteKey('${key._id}')">Delete</button>
                </div>
            `).join('');
        }

        async function createApiKey() {
            const name = prompt('API Key name:');
            if (!name) return;
            const plan = prompt('Plan (free/basic/pro/enterprise):', 'free');
            await apiCall('/api/keys', { method: 'POST', body: JSON.stringify({ name, plan }) });
            showToast('API Key created!');
            loadUser();
        }

        async function deleteKey(id) {
            if (!confirm('Delete this API key?')) return;
            await apiCall(`/api/keys/${id}`, { method: 'DELETE' });
            showToast('API Key deleted');
            loadUser();
        }

        async function loadFiles() {
            try {
                const files = await apiCall('/api/files');
                document.getElementById('totalFiles').innerText = files.length;
                let totalBytes = 0;
                const container = document.getElementById('filesList');
                if (!files.length) { container.innerHTML = '<div class="file-row">No files yet</div>'; return; }
                container.innerHTML = files.map(file => {
                    totalBytes += file.size;
                    const isExpired = file.expiredAt && new Date(file.expiredAt) < new Date();
                    return `
                        <div class="file-row">
                            <div class="file-name" title="${escapeHtml(file.originalName)}">${escapeHtml(file.originalName).substring(0, 40)}${escapeHtml(file.originalName).length > 40 ? '...' : ''}</div>
                            <div>${(file.size/1024/1024).toFixed(2)} MB</div>
                            <div>${isExpired ? '<span style="color:#ef4444;">Expired</span>' : '<span style="color:#10b981;">Active</span>'}</div>
                            <div>${!isExpired ? `<a href="/api/file/${file._id}" target="_blank" style="color:#667eea; font-size:0.75rem;">🔗 Link</a>` : '-'}</div>
                        </div>
                    `;
                }).join('');
                document.getElementById('totalSize').innerText = (totalBytes/1024/1024).toFixed(1);
            } catch(e) { showToast('Failed to load files', 'error'); }
        }

        document.querySelectorAll('.expiry-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.expiry-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentExpiry = btn.dataset.expiry;
            });
        });

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        const urlResult = document.getElementById('urlResult');
        const uploadedUrlSpan = document.getElementById('uploadedUrl');

        uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('drag-over'); });
        uploadArea.addEventListener('dragleave', () => { uploadArea.classList.remove('drag-over'); });
        uploadArea.addEventListener('drop', (e) => { e.preventDefault(); uploadArea.classList.remove('drag-over'); handleFiles(Array.from(e.dataTransfer.files)); });
        uploadArea.addEventListener('click', () => { fileInput.click(); });
        fileInput.addEventListener('change', (e) => { handleFiles(Array.from(e.target.files)); });

        function handleFiles(files) {
            selectedFiles = files.filter(f => f.size <= 50 * 1024 * 1024);
            if (!selectedFiles.length) { showToast('Files exceed 50MB limit', 'error'); return; }
            uploadFiles();
        }

        async function getFirstApiKey() {
            const keys = await apiCall('/api/keys');
            return keys[0]?.apiKey;
        }

        async function uploadFiles() {
            const apiKey = await getFirstApiKey();
            if (!apiKey) { showToast('Create an API key first', 'error'); return; }

            uploadBtn.disabled = true;
            progressContainer.style.display = 'block';
            urlResult.classList.remove('show');

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const formData = new FormData();
                formData.append('file', file);
                formData.append('expiry', currentExpiry);

                await new Promise((resolve, reject) => {
                    const xhr = new XMLHttpRequest();
                    xhr.upload.addEventListener('progress', (e) => {
                        if (e.lengthComputable) {
                            const percent = Math.round((e.loaded / e.total) * 100);
                            progressFill.style.width = `${percent}%`;
                            progressText.textContent = `${percent}% - ${file.name}`;
                        }
                    });
                    xhr.onload = () => {
                        if (xhr.status === 200) {
                            const response = JSON.parse(xhr.responseText);
                            const fullUrl = response.fullUrl || `${window.location.origin}/api/file/${response.fileId}`;
                            lastUploadedUrl = fullUrl;
                            uploadedUrlSpan.textContent = fullUrl;
                            urlResult.classList.add('show');
                            showToast(`✓ ${file.name} uploaded!`, 'success', fullUrl);
                            resolve();
                        } else {
                            reject();
                        }
                    };
                    xhr.onerror = () => reject();
                    xhr.open('POST', '/api/upload');
                    xhr.setRequestHeader('x-api-key', apiKey);
                    xhr.send(formData);
                });
            }

            uploadBtn.disabled = false;
            progressContainer.style.display = 'none';
            progressFill.style.width = '0%';
            progressText.textContent = '0%';
            selectedFiles = [];
            loadFiles();
        }

        function escapeHtml(str) { return str.replace(/[&<>]/g, m => m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'); }
        function logout() { localStorage.clear(); window.location.href = '/login'; }

        loadUser();
        loadFiles();
    </script>
</body>
</html>
